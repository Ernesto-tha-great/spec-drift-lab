name: a4-steps (temporary)
on:
  push:
    branches: [main]
    paths: ['tmp-a4/**', '.github/workflows/a4-steps.yml']
jobs:
  steps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tmp-a4/project
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test 2>&1 | grep -E '^# (pass|fail)'
      - name: Steps 2 to 4 on Wikipedia
        run: |
          for s in s2 s3 s4; do
            rm -rf ../run && mkdir ../run && cp -r . ../run/ && cp -r ../steps/$s/* ../run/
            [ "$s" = s2 ] && rm ../run/src/coverage.ts
            echo "===== $s wikipedia"
            (cd ../run && npm run -s measure -- https://en.wikipedia.org/wiki/Main_Page) || echo "exit $?"
          done
      - name: Step 2 on a site that blocks bots
        run: |
          rm -rf ../run && mkdir ../run && cp -r . ../run/ && cp -r ../steps/s2/* ../run/ && rm ../run/src/coverage.ts
          for url in https://www.reddit.com/ https://www.linkedin.com/; do
            echo "===== s2 $url"
            (cd ../run && npm run -s measure -- $url) || echo "exit $?"
          done
      - name: Step 4 on CNN and Google
        run: |
          for url in https://www.cnn.com/ https://www.google.com/; do
            echo "===== s4 $url"
            npm run -s measure -- $url || echo "exit $?"
          done
      - name: Step 5, prices and income
        run: |
          rm -f data/*
          echo "===== fetch:prices"; npm run -s fetch:prices
          echo "===== fetch:income"; npm run -s fetch:income
          echo "===== prices head"; head -6 data/prices.csv; grep -E '"(Kenya|India|Brazil|Germany|United States|United Kingdom|Japan|Colombia)"' data/prices.csv
          echo "===== income head"; head -6 data/income.csv; grep -E '^(KEN|IND|BRA|DEU|USA|GBR|JPN|COL),' data/income.csv
          echo "===== meta"; cat data/prices.meta.json data/income.meta.json
      - name: Step 6, cost
        run: |
          echo "===== cost wikipedia"
          npm run -s cost -- https://en.wikipedia.org/wiki/Main_Page Kenya India Brazil Colombia Japan Germany "United States" "United Kingdom" || echo "exit $?"
          echo "===== cost cnn"
          npm run -s cost -- https://www.cnn.com/ Kenya India Brazil Colombia Japan Germany "United States" "United Kingdom" || echo "exit $?"
      - name: Step 7, budget
        run: |
          echo "===== budget wikipedia"
          npm run -s budget -- budget.json; echo "exit code $?"
          echo "===== budget cnn"
          npm run -s budget -- budget.json https://www.cnn.com/; echo "exit code $?"
