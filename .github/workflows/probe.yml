name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tessl CLI and docs
        continue-on-error: true
        run: |
          for q in "standard webhooks" "standardwebhooks" "webhook signature verification" "spec driven development"; do
            echo "===== search: $q"; timeout 60 npx -y @tessl/cli search "$q" 2>&1 | head -40
          done
          echo "===== install help"; timeout 60 npx -y @tessl/cli install --help 2>&1 | head -40
          mkdir -p /tmp/t && cd /tmp/t && echo '{}' > package.json
          echo "===== install"; timeout 120 npx -y @tessl/cli install github:hookdeck/webhook-skills 2>&1 | tail -30
          echo "===== files"; find /tmp/t -type f -not -path '*/node_modules/*' | head -80
          echo "===== hookdeck repo skills"; curl -sS https://api.github.com/repos/hookdeck/webhook-skills/contents/skills | python3 -c "import json,sys; print([f['name'] for f in json.load(sys.stdin)])"
          echo "===== core concepts"; curl -sSL https://docs.tessl.io/introduction-to-tessl/core-concepts.md | head -c 6000
