name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tessl CLI and docs
        continue-on-error: true
        run: |
          mkdir -p /tmp/a /tmp/b && echo '{}' > /tmp/a/package.json && echo '{}' > /tmp/b/package.json
          echo "===== install tessl-labs/spec-driven-development"
          (cd /tmp/a && timeout 180 npx -y @tessl/cli install tessl-labs/spec-driven-development --yes --agent claude-code 2>&1 | tail -25)
          find /tmp/a -type f -not -path '*/node_modules/*' | head -60
          for f in $(find /tmp/a -name '*.md' -not -path '*/node_modules/*' | head -12); do echo "----- $f ($(wc -c < $f) bytes)"; head -c 1500 "$f"; echo; done
          echo "===== install svix-webhooks skill"
          (cd /tmp/b && timeout 180 npx -y @tessl/cli install github:hookdeck/webhook-skills --skill svix-webhooks --yes --agent claude-code 2>&1 | tail -25)
          find /tmp/b -type f -not -path '*/node_modules/*' | head -60
          for f in $(find /tmp/b -name '*.md' -not -path '*/node_modules/*' | head -8); do echo "----- $f ($(wc -c < $f) bytes)"; head -c 4000 "$f"; echo; done
