name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Who answers each LLM endpoint?
        continue-on-error: true
        run: |
          for url in \
            https://models.github.ai/inference/chat/completions \
            https://api.anthropic.com/v1/messages \
            https://api.openai.com/v1/chat/completions \
            https://generativelanguage.googleapis.com/v1beta/models \
            https://example.com/ ; do
            echo "== $url"
            getent hosts "$(echo "$url" | cut -d/ -f3)" || echo "(no DNS)"
            curl -sS -o body.txt -D headers.txt -w 'HTTP %{http_code} from %{remote_ip}\n' -X POST "$url" \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{}' || true
            grep -iE '^(server|content-type|via|x-github-request-id|request-id|cf-ray):' headers.txt || true
            head -c 300 body.txt; echo; echo
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Secrets present?
        run: |
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY; do
            if [ -n "${!name}" ]; then echo "$name is set"; else echo "$name is not set"; fi
          done
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
