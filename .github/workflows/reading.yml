name: reading
on:
  push:
    paths: ['.github/workflows/reading.yml']
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright@1.56 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Fetch articles as text
        run: |
          cat > read.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const context = await browser.newContext({ userAgent: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36', locale: 'en-US' });
          const page = await context.newPage();
          const show = (title, body) => console.log(`\n\n========== BEGIN ${title} ==========\n${body}\n========== END ${title} ==========`);
          async function read(url, selector = 'article') {
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(6000);
              const text = await page.evaluate((sel) => {
                const el = document.querySelector(sel) || document.querySelector('main') || document.body;
                el.querySelectorAll('pre').forEach((p) => { p.innerText = '\n```\n' + p.innerText + '\n```\n'; });
                el.querySelectorAll('h1,h2,h3').forEach((h) => { h.innerText = '\n' + '#'.repeat(Number(h.tagName[1])) + ' ' + h.innerText; });
                return el.innerText;
              }, selector);
              show(url, `${await page.title()}\n\n${text.slice(0, 40000)}`);
            } catch (e) { show(url, `FAILED: ${e.message.split('\n')[0]}`); }
          }
          async function links(url, pattern) {
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(6000);
              const hrefs = await page.$$eval('a[href]', (as) => as.map((a) => a.href));
              const found = [...new Set(hrefs.filter((h) => new RegExp(pattern).test(h)))];
              show(`links on ${url}`, found.join('\n'));
              return found;
            } catch (e) { show(`links on ${url}`, `FAILED: ${e.message}`); return []; }
          }
          await read('https://dzone.com/articles/caching-rate-limiting-redis-nextjs');
          await read('https://hackernoon.com/rollups-are-the-futurebut-their-biggest-bottleneck-might-be-a-single-point-of-failure');
          const hn = await links('https://hackernoon.com/u/ernestnnamdi', '^https://hackernoon\\.com/[a-z0-9-]{20,}$');
          for (const url of hn.filter((u) => !u.includes('rollups-are-the-future')).slice(0, 3)) await read(url);
          const hashnode = await links('https://hashnode.com/@Ernest-Nnamdi', 'hashnode\\.dev/|bulaveur');
          const posts = hashnode.filter((u) => /hashnode\.dev\/[a-z0-9-]{8,}/.test(u)).slice(0, 4);
          for (const url of posts) await read(url);
          await links('https://dev.to/search?q=Ernest%20Nnamdi', '^https://dev\\.to/[^/]+/[a-z0-9-]{10,}$');
          const feed = await (await fetch('https://craftoverflow.substack.com/feed')).text();
          const items = [...feed.matchAll(/<item>[\s\S]*?<title><!\[CDATA\[(.*?)\]\]><\/title>[\s\S]*?<link>(.*?)<\/link>/g)].map((m) => ({ title: m[1], link: m[2] }));
          show('craftoverflow feed', items.map((i) => `${i.title} | ${i.link}`).join('\n') || feed.slice(0, 500));
          for (const { link } of items.slice(0, 7)) await read(link, 'div.available-content, article');
          await browser.close();
          JS
          node read.mjs
