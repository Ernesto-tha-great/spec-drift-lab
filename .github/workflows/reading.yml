name: reading
on:
  push:
    paths: ['.github/workflows/reading.yml']
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright@1.56 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Fetch articles as text
        timeout-minutes: 9
        run: |
          cat > read.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          setTimeout(() => { console.log('\n[hard stop]'); process.exit(0); }, 8 * 60 * 1000);
          const context = await browser.newContext({ userAgent: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36', locale: 'en-US' });
          const page = await context.newPage();
          const show = (title, body) => console.log(`\n\n========== BEGIN ${title} ==========\n${body}\n========== END ${title} ==========`);
          const within = (ms, p) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms))]);
          async function read(url, selector = 'article') { return within(60000, readInner(url, selector)).catch((e) => show(url, `FAILED: ${e.message}`)); }
          async function readInner(url, selector) {
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(6000);
              const text = await page.evaluate((sel) => {
                const el = document.querySelector(sel) || document.querySelector('main') || document.body;
                el.querySelectorAll('pre').forEach((p) => { p.innerText = '\n```\n' + p.innerText + '\n```\n'; });
                el.querySelectorAll('h1,h2,h3').forEach((h) => { h.innerText = '\n' + '#'.repeat(Number(h.tagName[1])) + ' ' + h.innerText; });
                return el.innerText;
              }, selector);
              show(url, `${await page.title()}\n\n${text.slice(0, 40000)}`);
            } catch (e) { show(url, `FAILED: ${e.message.split('\n')[0]}`); }
          }
          async function links(url, pattern) { return within(60000, linksInner(url, pattern)).catch((e) => { show(`links on ${url}`, `FAILED: ${e.message}`); return []; }); }
          async function linksInner(url, pattern) {
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(6000);
              const hrefs = await page.$$eval('a[href]', (as) => as.map((a) => a.href));
              const found = [...new Set(hrefs.filter((h) => new RegExp(pattern).test(h)))];
              show(`links on ${url}`, found.join('\n'));
              return found;
            } catch (e) { show(`links on ${url}`, `FAILED: ${e.message}`); return []; }
          }
          // HackerNoon renders from page data; read the whole body.
          for (const url of [
            'https://hackernoon.com/how-to-build-a-decentralized-betting-platform-with-solidity-and-reactjs',
            'https://hackernoon.com/building-a-production-grade-testnet-faucet-with-typescript-redis-and-nextjs',
            'https://hackernoon.com/rollups-are-the-futurebut-their-biggest-bottleneck-might-be-a-single-point-of-failure',
          ]) await read(url, 'body');
          // Hashnode: the public GraphQL API, not the Cloudflare-protected page.
          try {
            const res = await fetch('https://gql.hashnode.com', {
              method: 'POST', headers: { 'content-type': 'application/json' }, signal: AbortSignal.timeout(20000),
              body: JSON.stringify({ query: '{ publication(host: "ernestnamdi.hashnode.dev") { posts(first: 10) { edges { node { title url publishedAt content { markdown } } } } } }' }),
            });
            const json = await res.json();
            for (const { node } of json?.data?.publication?.posts?.edges ?? []) show(`hashnode: ${node.title} (${node.publishedAt?.slice(0, 10)})`, node.content.markdown.slice(0, 30000));
            if (!json?.data) show('hashnode', JSON.stringify(json).slice(0, 800));
          } catch (e) { show('hashnode', `FAILED: ${e.message}`); }
          // Craft Overflow via the Wayback Machine.
          try {
            const cdx = await fetch('https://web.archive.org/cdx/search/cdx?url=craftoverflow.substack.com/p/*&output=json&fl=original,timestamp&filter=statuscode:200&collapse=urlkey&limit=300', { signal: AbortSignal.timeout(30000) }).then((r) => r.json());
            const rows = cdx.slice(1).filter(([u]) => !/\/comments|\?|#/.test(u));
            show('craftoverflow captures', rows.map(([u, t]) => `${t} ${u}`).join('\n'));
            const preferred = rows.filter(([u]) => /erc721|ethereum|solidity|javascript|react|graphql|node|web3|smart|git|api|rust|code|engineer/i.test(u));
            for (const [u, t] of [...preferred, ...rows].filter((r, i, a) => a.indexOf(r) === i).slice(0, 6)) await read(`https://web.archive.org/web/${t}/${u}`, 'div.available-content, div.body, article');
          } catch (e) { show('craftoverflow', `FAILED: ${e.message}`); }
          await browser.close();
          JS
          node read.mjs
