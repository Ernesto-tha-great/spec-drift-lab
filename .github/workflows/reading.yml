name: reading
on:
  push:
    paths: ['.github/workflows/reading.yml']
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch articles as text
        shell: python
        run: |
          import json, re, urllib.request
          from html.parser import HTMLParser

          UA = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36', 'Accept': 'text/html,application/json'}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                      return r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return f'FETCH FAILED: {e}'

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.out = []; self.skip = 0; self.pre = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'nav', 'footer', 'svg', 'noscript', 'header'): self.skip += 1
                  elif tag == 'pre': self.pre += 1; self.out.append('\n```\n')
                  elif tag in ('h1', 'h2', 'h3', 'h4'): self.out.append('\n\n' + '#' * int(tag[1]) + ' ')
                  elif tag in ('p', 'div', 'br', 'blockquote'): self.out.append('\n')
                  elif tag == 'li': self.out.append('\n- ')
                  elif tag == 'code' and not self.pre: self.out.append('`')
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'nav', 'footer', 'svg', 'noscript', 'header'): self.skip = max(0, self.skip - 1)
                  elif tag == 'pre': self.pre -= 1; self.out.append('\n```\n')
                  elif tag == 'code' and not self.pre: self.out.append('`')
                  elif tag in ('p', 'h1', 'h2', 'h3', 'h4'): self.out.append('\n')
              def handle_data(self, data):
                  if not self.skip: self.out.append(data if self.pre else re.sub(r'\s+', ' ', data))
          def text(html):
              m = re.search(r'<article[\s\S]*?</article>', html)
              p = Text(); p.feed(m.group(0) if m else html)
              return re.sub(r'\n{3,}', '\n\n', ''.join(p.out)).strip()

          def show(title, body):
              print(f'\n\n========== BEGIN {title} ==========\n{body}\n========== END {title} ==========')

          for url in [
              'https://dzone.com/articles/caching-rate-limiting-redis-nextjs',
              'https://hackernoon.com/rollups-are-the-futurebut-their-biggest-bottleneck-might-be-a-single-point-of-failure',
              'https://hackernoon.com/building-a-production-grade-testnet-faucet-with-typescript-redis-and-nextjs',
              'https://rss.boorghani.com/?p=241216',
          ]:
              show(url, text(get(url))[:30000])

          base = 'https://craftoverflow.substack.com/api/v1'
          archive = json.loads(get(f'{base}/archive?sort=new&limit=50') or '[]') if not get(f'{base}/archive?sort=new&limit=50').startswith('FETCH') else []
          print('\n\n========== CRAFT OVERFLOW ARCHIVE ==========')
          for post in archive:
              print(f"- {post.get('post_date','')[:10]} | {post.get('title')} | {post.get('subtitle')} | {post.get('slug')} | {post.get('wordcount')} words")
          for post in sorted(archive, key=lambda p: -(p.get('wordcount') or 0))[:8]:
              full = get(f"{base}/posts/{post['slug']}")
              try: body = json.loads(full).get('body_html') or ''
              except Exception: body = full
              show(f"craftoverflow/{post['slug']}: {post.get('title')} | {post.get('subtitle')}", text(body)[:25000])
